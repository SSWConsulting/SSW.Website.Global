name: Update Repo Settings

on:
  push:
    branches: [main]
    paths: [.github/settings.yml]

  pull_request:
    branches: [main]
    paths: [.github/settings.yml]

  workflow_dispatch:

permissions:
  contents: read
  administration: write

jobs:
  apply_settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # PR runs: dry-run only — log errors, never apply
      - name: Dry-run settings (PR)
        id: dryrun
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: GuacamoleResearch/actions-settings@v3-beta-updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push to main / workflow_dispatch only — actually apply settings
      - name: Apply production repo settings
        if: github.event_name != 'pull_request'
        uses: GuacamoleResearch/actions-settings@v3-beta-updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
