name: PR - Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Fully local Tina + Astro build — no Tina Cloud creds, no Cloudflare deploy.
      # Catches schema/type/render breakage before the deploy workflows touch CF.
      - name: Tina + Astro build (local)
        run: pnpm run build:local
        env:
          NODE_OPTIONS: --max-old-space-size=4096
