name: PR - Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Mirrors what Cloudflare Workers Builds runs on every push, so any
      # Tina Cloud schema-sync or Astro render breakage shows up here first.
      # Requires repo secrets: PUBLIC_TINA_CLIENT_ID, TINA_TOKEN.
      - name: Tina + Astro build (CF parity)
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PUBLIC_TINA_CLIENT_ID: ${{ secrets.PUBLIC_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
